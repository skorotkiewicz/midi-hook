<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">MIDI Hook</title>
  <desc id="desc">A neon MIDI keyboard connects to a terminal command prompt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b16"/>
      <stop offset="1" stop-color="#17102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <path d="M0 272C220 205 382 355 620 258S970 185 1200 244V320H0Z" fill="#7c3aed" opacity=".08"/>

  <g transform="translate(62 69)">
    <rect x="0" y="0" width="330" height="180" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <circle cx="29" cy="28" r="7" fill="#22d3ee" filter="url(#glow)"/>
    <circle cx="54" cy="28" r="7" fill="#c084fc"/>
    <path d="M28 54H302" stroke="#334155" stroke-width="2"/>

    <g transform="translate(25 75)">
      <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5">
        <rect x="0" y="0" width="40" height="80" rx="0 0 5 5"/>
        <rect x="40" y="0" width="40" height="80" rx="0 0 5 5"/>
        <rect x="80" y="0" width="40" height="80" rx="0 0 5 5"/>
        <rect x="120" y="0" width="40" height="80" rx="0 0 5 5"/>
        <rect x="160" y="0" width="40" height="80" rx="0 0 5 5"/>
        <rect x="200" y="0" width="40" height="80" rx="0 0 5 5"/>
        <rect x="240" y="0" width="40" height="80" rx="0 0 5 5"/>
      </g>
      <g fill="#111827">
        <rect x="27" y="0" width="25" height="49" rx="0 0 4 4"/>
        <rect x="68" y="0" width="25" height="49" rx="0 0 4 4"/>
        <rect x="147" y="0" width="25" height="49" rx="0 0 4 4"/>
        <rect x="188" y="0" width="25" height="49" rx="0 0 4 4"/>
        <rect x="229" y="0" width="25" height="49" rx="0 0 4 4"/>
      </g>
      <rect x="120" y="0" width="40" height="80" rx="0 0 5 5" fill="#22d3ee" opacity=".78" filter="url(#glow)"/>
    </g>
  </g>

  <path d="M393 160C455 160 446 106 498 106C548 106 523 209 583 209" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M579 188V217C579 246 615 252 630 228" fill="none" stroke="#c084fc" stroke-width="7" stroke-linecap="round"/>

  <g transform="translate(638 65)">
    <text x="0" y="70" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="70" font-weight="800" letter-spacing="4">MIDI HOOK</text>
    <rect x="2" y="96" width="470" height="2" fill="url(#accent)"/>
    <text x="2" y="137" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Bind a key. Run a command.</text>
    <g transform="translate(2 164)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="0" y="0" fill="#22d3ee">note 60</text>
      <text x="92" y="0" fill="#64748b">→</text>
      <text x="122" y="0" fill="#c084fc">beep</text>
    </g>
  </g>
</svg>
