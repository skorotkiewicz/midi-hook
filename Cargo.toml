[package]
name = "midi-hook"
version = "0.3.0"
edition = "2024"

[dependencies]
crossterm = "0.29"
midir = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
